interface:
  display_name: "Skill Build GitHub Deploy Install"
  short_description: "Own skill discovery, publishing and verified installation"
  default_prompt: "Use $skill-1build-2githubdeploy-3npxskillsinstall-skill as the owning workflow for every skill discovery, install, creation, enhancement, publication or reinstall task. Inspect authoritative sources and actual prior use; use $find-skills when discovery helps. Publish changed owner-authored sources, but install unchanged third-party skills from their maintained upstream without an unnecessary fork or republication. Preserve useful installed-only work and explicit discovery-only/read-only limits. Install through the actual runtime contract (Grok persisted /home/workdir/.grok/skills with skill-creator init/validate; supported Codex/Claude installations retain scoped Vercel skills), verify complete remote/source/installed equality and shared symlinks, and distinguish installation from available models, roles and live loading. Preserve unique variants and intended app enablement. Do not infer Grok from vague phrases or npx failures. Read targets completely, edit authoritative sources rather than installed aliases, and use an available authorised shell such as Desktop Commander when no local shell exists."
