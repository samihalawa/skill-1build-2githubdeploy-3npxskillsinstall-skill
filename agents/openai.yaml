interface:
  display_name: "Skill Build GitHub Deploy Install"
  short_description: "Publish skills and install them on the current runtime"
  default_prompt: "Use $skill-1build-2githubdeploy-3npxskillsinstall-skill as an execution contract. Detect Grok vs Codex first. On Grok write and validate /home/workdir/.grok/skills/<name> with skill-creator and do not use npx. On Codex or Claude resolve PROJECTS_MCP_TOOLS, push GitHub, and reinstall with npx skills@latest. Treat phrases such as instead he has a skill or in this environment as Grok-local install. Do not require the user to repeat update, deploy, commit, push, reinstall, or verify."
