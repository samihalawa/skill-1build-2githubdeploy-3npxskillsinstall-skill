interface:
  display_name: "Skill Build GitHub Deploy Install"
  short_description: "Publish canonical skills and reconcile shared symlink installs"
  default_prompt: "Use $skill-1build-2githubdeploy-3npxskillsinstall-skill to update each authoritative source, preserve source and installed lessons, validate, publish, install through the actual runtime contract (Grok persisted /home/workdir/.grok/skills with skill-creator init/validate; supported Codex/Claude installations retain scoped Vercel skills), and verify remote/source/installed equality; when reconciling app or CC Switch installations, compare complete trees and preserve unique variants while keeping one physical payload with verified symlinks and intended app enablement. Do not detect Grok from vague phrases or npx failures alone. Read each target completely, edit its source rather than an installed alias, and use an available authorised shell such as Desktop Commander when no local shell exists. Complete the lifecycle unless the user explicitly limits publication or installation."
