interface:
  display_name: "Skill Build GitHub Deploy Install"
  short_description: "Enhance paired skills, publish their source repos, and reinstall them globally without repeated lifecycle instructions"
  default_prompt: "Use $skill-1build-2githubdeploy-3npxskillsinstall-skill as an execution contract. If one or more other skills are provided with notes or corrections, treat them as targets and automatically complete the full lifecycle: resolve each authoritative PROJECTS_MCP_TOOLS repo, enhance SKILL.md and agents/openai.yaml, validate, commit, push the correct public/private GitHub repo, reinstall globally with npx skills@latest add --global --all, and prove source/GitHub/installed-copy equality. Do not require the user to repeat update, redeploy, commit, push, reinstall, or verify. Stop before publication only when the user explicitly requests review-only or no commit/push/install."
